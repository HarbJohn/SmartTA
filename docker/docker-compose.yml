# SmartTA Docker Compose
# Usage: docker compose up --build -d
# Access: http://localhost:8501

services:
  smartta:
    # Platform auto-detected. To force: platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: smartta-final:latest
    container_name: smartta_final
    working_dir: /app
    restart: unless-stopped
    
    ports:
      - "8501:8501"
    
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    
    volumes:
      # YouTube lecture data
      - smartta-lectures:/app/SmartTA_Extensions/data/lectures:rw
      - smartta-transcripts:/app/SmartTA_Extensions/data/transcripts:rw
      - smartta-uploads:/app/SmartTA_Extensions/data/uploaded_files:rw
      - smartta-rag-index:/app/SmartTA_RAG/data/index:rw
      - smartta-shared:/app/data:rw
      - smartta-metadata:/app/data-metadata:rw
    
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2.5G
        reservations:
          cpus: '0.5'
          memory: 1.5G
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    networks:
      - smartta-network

volumes:
  smartta-lectures:
  smartta-transcripts:
  smartta-uploads:
  smartta-rag-index:
  smartta-shared:
  smartta-metadata:

networks:
  smartta-network:
    driver: bridge
